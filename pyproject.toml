[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elephant-handoff"
version = "0.4.1"
description = "Plugin runtime for carrying coding-agent sessions across harnesses."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Vishesh Yadav" }]
license = "MIT"
keywords = ["agents", "codex", "claude-code", "context", "mcp"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/vishesh9131/elephant"
Repository = "https://github.com/vishesh9131/elephant"
Issues = "https://github.com/vishesh9131/elephant/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
